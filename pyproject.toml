[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecom-agent-rl"
version = "0.1.0"
description = "Constraint-satisfaction post-training for long-horizon e-commerce agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# src layout：不装包也能跑测试。
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
packages = ["ecom_agent_rl"]
ignore_missing_imports = true
